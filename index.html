<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDE6D8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />

    <!--
      Set the theme before any CSS renders, so a returning visitor never sees
      a flash of the wrong one. Runs synchronously, blocking-parser style —
      deliberately not a module or deferred script. Mirrors useTheme.ts's
      storage key and default; keep the two in sync if either changes.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kashish-ai.theme");
          document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <!-- Primary Meta -->
    <title>KASHISH'S AI — AI/ML Developer & Generative AI Explorer</title>
    <meta
      name="description"
      content="KASHISH'S AI — the interactive AI-operating-system portfolio of Kashish Chopra, an AI/ML developer and Generative AI explorer building intelligent, RAG and agentic systems."
    />
    <meta name="author" content="Kashish Chopra" />
    <meta
      name="keywords"
      content="Kashish Chopra, AI/ML Developer, Generative AI, RAG, Agentic AI, LangChain, Python, Portfolio"
    />
    <!-- canonical and og:url are set per route at runtime from the live origin
         (see src/components/Seo.tsx). Set VITE_SITE_URL to pin them to one
         canonical host. -->

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KASHISH'S AI" />
    <meta property="og:title" content="KASHISH'S AI — AI/ML Developer & Generative AI Explorer" />
    <meta
      property="og:description"
      content="An interactive AI-operating-system portfolio: projects, skills, experience and a portfolio assistant."
    />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KASHISH'S AI — AI/ML Developer" />
    <meta
      name="twitter:description"
      content="An interactive AI-operating-system portfolio for Kashish Chopra."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts.
         Loaded without blocking first paint: the stylesheet is fetched with a
         non-matching media, then promoted once it arrives. `display=swap`
         means text renders in the fallback face immediately either way. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Kashish Chopra",
        "alternateName": "KASHISH'S AI",
        "jobTitle": "AI/ML Developer",
        "description": "AI/ML developer and Generative AI explorer building intelligent RAG and agentic systems.",
        "email": "mailto:kashishchopra2k05@gmail.com",
        "sameAs": [
          "https://github.com/kashishhchopra",
          "https://www.linkedin.com/in/kashish-chopra666559356/",
          "https://leetcode.com/u/kashishchopra152/"
        ],
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "The NorthCap University, Gurugram"
        },
        "knowsAbout": [
          "Machine Learning",
          "Deep Learning",
          "Generative AI",
          "Retrieval-Augmented Generation",
          "Agentic AI",
          "Python"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static paint shell.
           React clears this container on mount, but painting the hero from
           HTML means first contentful paint doesn't wait for the JS bundle.
           The markup mirrors the real hero (same classes, same spacing) so
           the handover produces no layout shift. -->
      <div id="paint-shell" class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-40 border-b border-white/10 bg-void/80 backdrop-blur-md">
          <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
            <div class="flex shrink-0 items-center gap-2">
              <span class="grid h-9 w-9 place-items-center rounded-lg border border-secondary/40 bg-secondary/10">
                <svg class="h-5 w-5 text-secondary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              </span>
              <span class="font-mono text-sm font-bold tracking-widest text-white">KASHISH'S AI</span>
            </div>
          </div>
        </header>
        <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-10">
          <div class="grid items-start gap-8 lg:grid-cols-[1.4fr_1fr]">
            <div>
              <p class="inline-flex items-center gap-2 rounded-full border border-emerald-400/25 bg-emerald-400/[0.07] px-3 py-1.5">
                <span class="relative flex h-2 w-2">
                  <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
                </span>
                <span class="font-mono text-[11px] uppercase tracking-[0.28em] text-emerald-300">System Online</span>
              </p>
              <h1 class="mt-5 text-[2.5rem] font-extrabold leading-[1.05] sm:text-6xl">
                <span class="text-display block">Hello, I'm</span>
                <span class="text-accent-gradient mt-1 block pb-1">KASHISH'S AI</span>
              </h1>
              <p class="mt-4 max-w-xl text-base leading-relaxed text-zinc-300 sm:text-lg">
                AI/ML Developer • Generative AI Explorer • Intelligent Systems Builder
              </p>
            </div>
          </div>
        </main>
      </div>

      <!-- If JS is disabled, show a readable fallback. -->
      <noscript>
        <div style="font-family: system-ui; color: #FAFAFA; background: #09090B; padding: 2rem; min-height: 100vh;">
          <h1>KASHISH'S AI — Kashish Chopra</h1>
          <p>AI/ML Developer • Generative AI Explorer • Intelligent Systems Builder.</p>
          <p>
            This portfolio uses JavaScript for its interactive AI-console interface. Please enable
            JavaScript, or reach me directly:
          </p>
          <ul>
            <li>Email: kashishchopra2k05@gmail.com</li>
            <li>GitHub: https://github.com/kashishhchopra</li>
            <li>LinkedIn: https://www.linkedin.com/in/kashish-chopra666559356/</li>
          </ul>
        </div>
      </noscript>
    </div>
    <script>
      // The shell paints the landing hero. On a deep link it would be the
      // wrong content, so drop it before first paint — a blank moment beats a
      // layout shift the visitor watches happen.
      if (location.pathname !== "/") {
        var shell = document.getElementById("paint-shell");
        if (shell) shell.remove();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
